name: Build Yeaaaaaaaa OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kickstart/**'
      - '.github/workflows/build-iso.yml'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Make build script executable
        run: chmod +x kickstart/build-inside-container.sh

      - name: Build ISO inside Fedora container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            registry.fedoraproject.org/fedora:40 \
            bash /workspace/kickstart/build-inside-container.sh

      - name: List output
        run: |
          find . -name "*.iso" -exec ls -lh {} \;

      - name: Generate checksum
        run: |
          find . -name "*.iso" -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeaaaaaaaa-OS-ISO
          path: |
            *.iso
            output/*.iso
            SHA256SUMS.txt
          retention-days: 5
          compression-level: 0
